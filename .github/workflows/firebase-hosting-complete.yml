name: Deploy Healthcare System to Firebase Hosting

on:
  push:
    branches:
      - main
      - login
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy-landing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            LandingPage/package-lock.json

      - name: Install deps (LandingPage)
        working-directory: LandingPage
        run: npm ci

      - name: Build (LandingPage)
        working-directory: LandingPage
        run: npm run build

      - name: Deploy LandingPage to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: health-centre-automation
          channelId: live
          target: landing
          entryPoint: .
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  build-and-deploy-login:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            login-folder/package-lock.json

      - name: Install deps (Login System)
        working-directory: login-folder
        run: npm ci

      - name: Build (Login System)
        working-directory: login-folder
        run: npm run build

      - name: Deploy Login System to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: health-centre-automation
          channelId: live
          target: login
          entryPoint: .
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  build-and-deploy-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            health-admin-dashboard/package-lock.json

      - name: Install deps (Admin Dashboard)
        working-directory: health-admin-dashboard
        run: npm ci

      - name: Build (Admin Dashboard)
        working-directory: health-admin-dashboard
        run: npm run build

      - name: Deploy Admin Dashboard to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: health-centre-automation
          channelId: live
          target: admin
          entryPoint: .
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks