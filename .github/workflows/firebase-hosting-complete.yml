name: Deploy Healthcare System to Firebase Hosting

on:
  push:
    branches:
      - main
      - login
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy-landing:
    name: Deploy Landing Page
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: LandingPage/package-lock.json

      - name: Install dependencies
        working-directory: LandingPage
        run: npm ci

      - name: Build Landing Page
        working-directory: LandingPage
        run: npm run build

      - name: Deploy Landing Page to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: health-centre-automation
          channelId: live
          target: landing
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  build-and-deploy-login:
    name: Deploy Login System
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: login-folder/package-lock.json

      - name: Install dependencies
        working-directory: login-folder
        run: npm ci

      - name: Build Login System
        working-directory: login-folder
        run: npm run build

      - name: Deploy Login System to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: health-centre-automation
          channelId: live
          target: login
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  build-and-deploy-admin:
    name: Deploy Admin Dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: health-admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: health-admin-dashboard
        run: npm ci

      - name: Build Admin Dashboard
        working-directory: health-admin-dashboard
        run: npm run build

      - name: Deploy Admin Dashboard to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: health-centre-automation
          channelId: live
          target: admin
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
