name: Deploy LandingPage to Firebase Hosting (login branch)

on:
  push:
    branches:
      - login

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            login-folder/package-lock.json
            LandingPage/package-lock.json

      - name: Install deps (login-folder)
        working-directory: login-folder
        run: npm ci

      - name: Build (login-folder)
        working-directory: login-folder
        run: npm run build

      - name: Install deps (LandingPage)
        working-directory: LandingPage
        run: npm ci

      - name: Build (LandingPage)
        working-directory: LandingPage
        run: npm run build

      # Deploy to Firebase Hosting
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --only hosting --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

