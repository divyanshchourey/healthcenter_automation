name: Deploy LandingPage to Firebase Hosting (login branch)

on:
  push:
    branches:
      - login

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            login-folder/package-lock.json
            LandingPage/package-lock.json

      - name: Install deps (login-folder)
        working-directory: login-folder
        run: npm ci

      - name: Build (login-folder)
        working-directory: login-folder
        run: npm run build

      - name: Install deps (LandingPage)
        working-directory: LandingPage
        run: npm ci

      - name: Build (LandingPage)
        working-directory: LandingPage
        run: npm run build

      # Deploy to Firebase Hosting
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Prepare credentials when using a Service Account JSON secret
      - name: Write Firebase service account
        if: secrets.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase_sa.json"

      - name: Deploy to Firebase Hosting (service account)
        if: secrets.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase_sa.json
        run: |
          firebase deploy --only hosting --non-interactive --force

      - name: Deploy to Firebase Hosting (token)
        if: secrets.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting --non-interactive --force --token "$FIREBASE_TOKEN"

